<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who Ate My Cheesecake?</title>
<style>
:root{
  --cream:#FFF6E9; --cream-2:#FFEFD9; --ink:#4A3728; --ink-soft:#7A6250;
  --line:#E7D3B8; --accent:#E8894A; --accent-2:#F6B26B; --good:#7BB26A; --bad:#D9705E;
  --card:#FFFDF8; --shadow:0 2px 0 #E7D3B8, 0 8px 24px rgba(120,90,60,.13);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#FFF9F0,#F6E7D2 70%);
  color:var(--ink);font:15px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
header.top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.logo{font-size:22px;font-weight:900}
.logo small{display:block;font-size:11px;font-weight:600;color:var(--ink-soft);letter-spacing:.06em}
.chip{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:14px}
@media (max-width:1000px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px}
.card h3{font-size:13px;color:var(--ink-soft);letter-spacing:.08em;margin-bottom:10px}
.who{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;cursor:pointer;border:1.5px solid transparent}
.who:hover{background:var(--cream)}
.who.on{background:var(--cream-2);border-color:var(--accent-2)}
.who.near{border-color:var(--good);background:rgba(123,178,106,.08)}
.who .avatar{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;flex:0 0 auto}
.who b{display:block;font-size:15px}
.who span{font-size:12px;color:var(--ink-soft)}
.stage{width:1536px;max-width:100%;margin:0 auto;border-radius:14px;border:1.5px solid var(--line);overflow:hidden;position:relative;background:#2A1F18;line-height:0}
#bg{position:relative;display:block;width:100%;height:auto;image-rendering:pixelated;z-index:0}
#scene,#overlay{position:absolute;top:0;left:0;width:100%;height:100%;image-rendering:pixelated}
#scene{cursor:pointer;z-index:1}
#overlay{z-index:2;pointer-events:none}
.roomtag{position:absolute;left:12px;top:10px;font-size:12px;font-weight:800;color:#fff;
  background:rgba(50,34,22,.62);padding:4px 10px;border-radius:999px;line-height:1.4}
.log{height:96px;overflow:auto;padding:6px 2px;display:flex;flex-direction:column;gap:10px;margin-top:10px}
.msg{max-width:82%;padding:10px 13px;border-radius:16px;white-space:pre-wrap}
.msg.npc{background:var(--cream);border:1.5px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start}
.msg.me{background:#FFE3CC;border:1.5px solid #F2C79A;border-bottom-right-radius:6px;align-self:flex-end}
.msg.sys{background:#FFF3E0;border:1.5px dashed var(--line);color:var(--ink-soft);
  font-size:12.5px;align-self:center;max-width:94%;text-align:center;border-radius:12px}
.msg .nm{display:block;font-size:11px;font-weight:800;color:var(--accent);margin-bottom:3px}
.ask{display:flex;gap:8px;margin-top:10px}
.ask input{flex:1;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font:inherit}
.ask input:focus{outline:2px solid var(--accent-2);outline-offset:1px}
button{font:inherit;font-weight:800;border-radius:14px;border:1.5px solid var(--line);background:var(--card);
  padding:10px 14px;cursor:pointer;box-shadow:var(--shadow)}
button.primary{background:var(--accent);border-color:#D2762F;color:#fff}
button:disabled{opacity:.5;cursor:default}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick button{padding:6px 10px;font-size:12.5px;font-weight:700;border-radius:999px}
table{border-collapse:collapse;width:100%;font-size:11px}
th,td{border:1px solid var(--line);padding:3px 2px;text-align:center;height:26px}
th{background:var(--cream);font-size:10.5px;color:var(--ink-soft)}
td.conflict{background:#FFE2DC;color:#B4442F;font-weight:800}
td.own{background:#EFF7EA}
.note{font-size:12px;color:var(--ink-soft)}
.stage .overchat{position:absolute;left:14px;bottom:10px;width:500px;max-width:52%;z-index:3;
  background:rgba(255,253,248,.78);backdrop-filter:blur(4px);border:1.5px solid rgba(231,211,184,.9);
  border-radius:14px;box-shadow:0 8px 24px rgba(90,60,30,.20);padding:8px 10px;line-height:1.45;
  opacity:.72;transition:opacity .15s}
.stage .overchat h3{display:none}
.stage .overchat .ask{margin-top:6px}
.stage .overchat .ask input{padding:8px 11px}
.stage .overchat .quick{margin-top:5px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.stage .overchat .quick button{white-space:nowrap}
.stage .overchat .msg{padding:7px 10px;border-radius:12px}
.stage .overchat:hover,.stage .overchat:focus-within{opacity:1;background:rgba(255,253,248,.96)}
.stage .overchat.away{display:none}
#chatToggle{position:absolute;left:14px;bottom:14px;z-index:4;padding:8px 14px;border-radius:999px;
  background:rgba(255,253,248,.9);backdrop-filter:blur(3px)}
#chatClose{position:absolute;right:10px;top:8px;padding:2px 9px;border-radius:999px;font-size:13px;box-shadow:none}
.stage .overchat h3{margin-bottom:6px}
.stage .overchat .quick button{padding:5px 9px;font-size:12px}
@media (max-width:900px){.stage .overchat{position:static;max-width:100%;width:auto}}
dialog{border:none;border-radius:20px;padding:0;box-shadow:0 20px 60px rgba(90,60,30,.3);max-width:520px}
dialog::backdrop{background:rgba(60,40,25,.45)}
.dlg{padding:22px;background:var(--card)}
.dlg h2{font-size:20px;margin-bottom:8px}
.sel{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.sel button.on{background:var(--accent-2);border-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">Who Ate My Cheesecake?<small>SPUM · SAM</small></div>
    <div class="chip">
      <span class="pill" id="pillTime">시간 21시</span>
      <span class="pill" id="pillTalk">대화 0</span>
      <span class="pill" id="pillGossip">소문 0</span>
      <span class="pill" id="pillLLM">…</span>
      <button id="btnNextHour"> 다음 시각 ▶</button>
      <button id="btnNew">새 판</button>
      <button class="primary" id="btnAccuse">지목하기</button>

  <section class="card" style="padding:8px;margin-bottom:14px">

  <div class="grid">

        엿들은 소문은 여기 안 올라간다 — 직접 물어서 확인해라</p>
    </section>

</div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script type="module">
import { makeRound, knowledgeOf, nameOf, ROOMS, HOURS, CAST } from './round.mjs';
import { buildMessages, buildGossipMessages, violations, classifyIntent, topicOf, MODEL } from './dialogue.mjs';
import { createMemory, gossipOnce, gossipLine, noteAsked, memorySize, heardCount } from './memory.mjs';
import { W as HW, H as HH, SPOT, ZONES, roomOf } from './house.mjs';
import { loadSpumMap } from './spummap.mjs';

const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };

// ── 캐릭터 외모 (SPUM equipment) ─────────────────────────────
const CHARACTER_EQUIP = {
  sgn_haru:  { body: 'legacy_body_human_1', eye: 'legacy_eye_3', helmet: 'modernpackver1_hoodie', clothing: 'modernpackver1_winter1_c2', pants: 'elf_elf_pant_06' },
  sgn_mina:  { body: 'legacy_body_human_4', eye: 'legacy_eye_3', helmet: 'elf_helmet_17', clothing: 'elf_elf_cloth_09', pants: 'elf_elf_pant_03' },
  sgn_coco:  { body: 'legacy_body_human_2', eye: 'legacy_eye_3', helmet: 'legacy_helmet_1', clothing: 'modernpackver1_hoodie_c2', pants: 'elf_elf_pant_04' },
  sgn_lulu:  { body: 'legacy_body_elf_1', eye: 'legacy_eye_3', helmet: 'elf_helmet_06', clothing: 'legacy_f_sr_cloth', pants: 'legacy_f_sr_pants' },
  sgn_peach: { body: 'legacy_body_human_3', eye: 'legacy_eye_3', helmet: 'elf_helmet_12', clothing: 'modernpackver1_hoodie', pants: 'elf_elf_pant_06' },
  sgn_ruby:  { body: 'legacy_body_human_1', eye: 'legacy_eye_3', helmet: 'elf_helmet_12', clothing: 'legacy_f_sr_cloth', pants: 'legacy_f_sr_pants' },
};
const CHARACTER_COLORS = {
  sgn_haru:  { body: '#FFE4B5', helmet: '#FFD700', clothing: '#FFFACD', pants: '#FFF8DC', eye: '#3A3630' },
  sgn_mina:  { body: '#E6E6FA', helmet: '#9370DB', clothing: '#DDA0DD', pants: '#EE82EE', eye: '#3A3630' },
  sgn_coco:  { body: '#90EE90', helmet: '#228B22', clothing: '#98FB98', pants: '#F0FFF0', eye: '#3A3630' },
  sgn_lulu:  { body: '#87CEEB', helmet: '#4682B4', clothing: '#B0E0E6', pants: '#E0FFFF', eye: '#3A3630' },
  sgn_peach: { body: '#FFB6C1', helmet: '#FF69B4', clothing: '#FFC0CB', pants: '#FFE4E1', eye: '#3A3630' },
  sgn_ruby:  { body: '#FF6347', helmet: '#DC143C', clothing: '#FF4500', pants: '#FF7F50', eye: '#3A3630' },
};
const CHARACTER_EMOJI = {
  sgn_haru: '🍞', sgn_mina: '🌙', sgn_coco: '🌿', sgn_lulu: '🎨', sgn_peach: '🎵', sgn_ruby: '👩‍🍳',
};

// ── 배경: SPUM 맵을 한 번 구워서 #bg 에 깐다 ────────────────
// 런타임의 setGrid() 는 길찾기 전용이라 타일을 그리지 않는다.
// 타일 그림은 SPUM Studio 에서 구운 house-theme.png 에서 그대로 온다.
function drawBackground() {
  if (!spumMap) return;
  const cv = $('#bg'); if (!cv) return;
  const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, cv.width, cv.height);
  const baked = spumMap.bake();
  g.drawImage(baked, 0, 0, baked.width, baked.height, 0, 0, cv.width, cv.height);
}

// SPUM 런타임과 얼굴 굽기가 같은 정의를 본다.
function spumCharacterOf(characterId) {
  const equip = CHARACTER_EQUIP[characterId];
  if (!equip) return null;
  return {
    id: characterId,
    name: (CAST.find(c => c.id === characterId) || {}).name || characterId,
    appearance: { equipment: { ...equip }, colors: { ...(CHARACTER_COLORS[characterId] || {}) }, maskEnabled: true },
  };
}

// ── 로스터 얼굴 — SPUM 이 직접 굽는다 ───────────────────────
// 이모지는 자리표시자였다(🌙·🎵). SPUM 캐릭터 프리뷰로 진짜 얼굴을 뽑는다.
// 리소스(SPKG)는 월드 런타임이 이미 올려 둔 것을 그대로 쓴다 — ResourceLoader 는 싱글턴이다.
const avatarCache = {};
async function buildAvatars() {
  if (!spumReady) return;
  let host = null, preview = null;
  try {
    const mod = await import('/spum-cdn/packages/spum-character/preview/CharacterPreview.js');
    host = document.createElement('div');
    host.style.cssText = 'position:fixed;left:-9999px;top:0;width:180px;height:180px';
    document.body.append(host);
    preview = mod.createCharacterPreview(host);
    await preview.mount({});
    for (const c of CAST) {
      const tmpl = spumCharacterOf(c.id);
      if (!tmpl) continue;
      await preview.updateCharacter(tmpl);
      await new Promise(r => setTimeout(r, 140));      // 스프라이트가 붙을 틈을 준다
      const url = preview.captureThumbnail({ size: 128, focus: 'character' });
      if (url) avatarCache[c.id] = url;
    }
    console.log('[SPUM] 얼굴', Object.keys(avatarCache).length, '개를 구웠다');
  } catch (e) {
    console.warn('[SPUM] 얼굴 굽기 실패 — 이모지로 간다:', e.message);
  } finally {
    try { preview?.destroy(); } catch {}
    host?.remove();
    renderRoster();
  }
}

// ── SPUM 런타임 ─────────────────────────────────────────────
let spumRuntime = null, spumReady = false;
async function initSPUM() {
  try {
    const worldMod = await import('/spum-cdn/packages/spum-world/runtime/StudioSpumWorldRuntime.js');
    const canvas = $('#scene');
    spumRuntime = worldMod.createStudioSpumWorldRuntime({
      canvas,
      log: (level, msg, data) => {
        if (level === 'error' || level === 'warn') console[level]('[SPUM]', level, msg, data || '');
        else console.log('[SPUM]', level, msg, data || '');
      },
    });
    spumReady = true;
    console.log('[SPUM] Runtime loaded. Canvas size:', canvas.width, 'x', canvas.height);
  } catch (e) {
    console.warn('[SPUM] Load failed:', e.message);
    spumReady = false;
  }
}

// shouldRun: false → 런타임 자체 rAF 안 돌림. 우리가 sync()로만 데이터 갱신.
// 런타임이 내부적으로 매 프레임 canvas를 clear + redraw.
function syncSPUM() {
  if (!spumRuntime || !spumMap) return;
  const gridData = { width: MW, height: MH, tileSize: TS, grid: spumObstacle, signature: `house-${MW}x${MH}` };
  // 플레이어도 SPUM 캐릭터다 — 여섯 다 런타임이 그린다.
  const castEntries = CAST.map(c => {
    const isMe = c.id === PLAYER_ID;
    const gx = isMe ? playerGrid.x : (npcState[c.id]?.gx ?? SPOT[c.id].x);
    const gy = isMe ? playerGrid.y : (npcState[c.id]?.gy ?? SPOT[c.id].y);
    return { instanceId: c.id, characterId: c.id, spawnX: gx, spawnY: gy, x: gx, y: gy };
  });
  const characterLookup = spumCharacterOf;
  try {
    spumRuntime.sync({ grid: gridData, cast: castEntries, characterLookup, shouldRun: true, unitScale: UNIT_SCALE });
  } catch (e) {
    console.warn('[SPUM] sync error:', e.message);
  }
}

// ── 상태 ────────────────────────────────────────────────────
let spumMap = null, spumObstacle = null;
let world = [], round = null, cur = null, talks = 0, budget = 18;
const chat = {}, board = {}, topic = {}, discovered = {};
// SPUM Cast 의 인격(성격·MBTI·말투·내력). NPC 만 갖는다 —
// 플레이어가 고른 캐릭터의 인격은 아래 boot() 에서 통째로 지운다.
const castPersona = {}, castPersonaAll = {};
// NPC 마다 하나씩. 판이 새로 시작될 때만 갈아 끼운다.
const memories = {};
const gossipAt = {}, gossipTurn = {};
let gossipCount = 0;
let llmReady = false;
let currentHourIndex = 0, hourTimer = 0;
const HOUR_INTERVAL = 2700;
const ROOM_POS = {}; ZONES.forEach(z => { ROOM_POS[z.name] = { x: z.x, y: z.y }; });

const TS = 32, MW = HW, MH = HH;   // 테마 타일이 32px 이다 — 1:1 로 그린다
// 무대는 도면 크기를 따른다 (48×48 → 1536²). 하드코딩하면 도면을 고칠 때마다 어긋난다.
for (const id of ['#bg', '#scene', '#overlay']) {
  const c = document.querySelector(id); if (!c) continue;
  c.width = MW * TS; c.height = MH * TS;
}
{ const st = document.querySelector('.stage'); if (st) st.style.width = (MW * TS) + 'px'; }
// SPUM 월드 유닛 배율. 런타임 허용 0.035~0.35 (넘기면 잘린다).
// 0.055 는 한 칸에 딱 맞지만 너무 작아 얼굴이 안 보였다.
// 타일이 32px 로 커졌으니 배율도 같이 올린다 (24px 때 0.12 = 32px 때 0.16).
const UNIT_SCALE = 0.16;
let bubbles = {};

// 플레이어는 캐스트 6종 가운데 하나다. 고양이는 없앴다.
let PLAYER_ID = null;
const NPCS = () => CAST.filter(c => c.id !== PLAYER_ID);
const playerGrid = { x: 0, y: 0 };
const playerPx = { x: 0, y: 0 };
let playerQueue = [], playerMoving = false, playerPath = [], playerStep = 0, moveTimer = 0;
const MOVE_SPEED = 0.14;

const npcState = {};
// 플레이어를 고른 뒤에 자리를 잡는다 — 고른 캐릭터는 NPC 에서 빠진다.
function seatCast() {
  for (const k of Object.keys(npcState)) delete npcState[k];
  NPCS().forEach(c => {
    npcState[c.id] = { gx: SPOT[c.id].x, gy: SPOT[c.id].y, px: SPOT[c.id].x * TS, py: SPOT[c.id].y * TS,
      tx: null, ty: null, path: [], step: 0, moving: false, timer: Math.random() * 120 + 30,
      targetRoom: null, mode: 'idle' };
  });
  const me = SPOT[PLAYER_ID];
  playerGrid.x = me.x; playerGrid.y = me.y;
  playerPx.x = me.x * TS; playerPx.y = me.y * TS;
}
const NPC_SPEED = 0.12;

// ── 유틸 ────────────────────────────────────────────────────
function isWalkable(x, y) {
  if (x < 0 || y < 0 || x >= MW || y >= MH) return false;
  if (!spumObstacle) return false;
  return !spumObstacle[y * MW + x];
}
function findPath(sx, sy, ex, ey) {
  if (sx === ex && sy === ey) return [];
  if (!isWalkable(ex, ey)) return null;
  const W2 = MW, key = (x, y) => y * W2 + x;
  const open = [], closed = new Set();
  const h = (x, y) => Math.abs(x - ex) + Math.abs(y - ey);
  open.push({ x: sx, y: sy, g: 0, f: h(sx, sy), prev: null });
  const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
  while (open.length) {
    open.sort((a, b) => a.f - b.f);
    const cur = open.shift();
    if (cur.x === ex && cur.y === ey) {
      const path = []; let n = cur;
      while (n) { path.unshift({ x: n.x, y: n.y }); n = n.prev; }
      return path.slice(1);
    }
    closed.add(key(cur.x, cur.y));
    for (const [dx, dy] of dirs) {
      const nx = cur.x + dx, ny = cur.y + dy;
      if (!isWalkable(nx, ny) || closed.has(key(nx, ny))) continue;
      const g = cur.g + 1;
      const ex2 = open.find(n => n.x === nx && n.y === ny);
      if (ex2) { if (g < ex2.g) { ex2.g = g; ex2.f = g + h(nx, ny); ex2.prev = cur; } }
      else open.push({ x: nx, y: ny, g, f: g + h(nx, ny), prev: cur });
    }
  }
  return null;
}
function roomToGrid(roomName) {
  const base = ROOM_POS[roomName]; if (!base) return null;
  // 이름표 자리부터 나선으로 넓혀 가며 **빈 칸**을 찾는다.
  // 막힌 칸을 돌려주면 NPC 가 가구 위에 서 버린다 (예전 버그).
  for (let r = 0; r <= 8; r++) {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
      const x = base.x + dx, y = base.y + dy;
      if (isWalkable(x, y) && roomOf(x, y) === roomName) return { x, y };
    }
  }
  for (let r = 0; r <= 8; r++) {                       // 방을 못 찾으면 가까운 빈 칸이라도
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
      const x = base.x + dx, y = base.y + dy;
      if (isWalkable(x, y)) return { x, y };
    }
  }
  return null;
}

// ── 플레이어 이동 ───────────────────────────────────────────
function startPlayerMove(path) { if (!path || !path.length || playerMoving) return; playerPath = path; playerStep = 0; playerMoving = true; }
function updatePlayer(dt) {
  if (!playerMoving) return;
  moveTimer += dt * MOVE_SPEED;
  if (moveTimer >= 1) {
    moveTimer = 0;
    const next = playerPath[playerStep];
    if (next) {
      playerGrid.x = next.x; playerGrid.y = next.y;
      playerPx.x = next.x * TS; playerPx.y = next.y * TS;
      const room = roomOf(next.x, next.y); if (room) SPOT[PLAYER_ID].room = room;
      playerStep++;
      if (playerStep >= playerPath.length) { playerMoving = false; playerPath = []; return; }
    }
  }
  const target = playerPath[playerStep];
  if (target) {
    const t = moveTimer;
    playerPx.x = ((playerStep > 0 ? playerPath[playerStep-1].x : playerGrid.x) * (1-t) + target.x * t) * TS;
    playerPx.y = ((playerStep > 0 ? playerPath[playerStep-1].y : playerGrid.y) * (1-t) + target.y * t) * TS;
  }
}

// ── NPC 이동 ────────────────────────────────────────────────
function npcWander(id) {
  const s = npcState[id]; if (s.moving) return;
  s.timer--;
  if (s.timer > 0) return;
  s.timer = Math.random() * 90 + 60;
  const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
  const candidates = dirs.map(d => ({ x: s.gx + d[0], y: s.gy + d[1] })).filter(p => isWalkable(p.x, p.y));
  if (!candidates.length) return;
  const pick2 = candidates[Math.floor(Math.random() * candidates.length)];
  s.tx = pick2.x; s.ty = pick2.y; s.path = [{ x: pick2.x, y: pick2.y }]; s.step = 0; s.moving = true;
}
function sendNPCtoRoom(id, roomName) {
  const s = npcState[id];
  const target = roomToGrid(roomName); if (!target) return;
  const curRoom = roomOf(s.gx, s.gy); if (curRoom === roomName) return;
  const path = findPath(s.gx, s.gy, target.x, target.y);
  if (!path || !path.length) return;
  s.path = path; s.step = 0; s.moving = true; s.mode = 'moving';
}
function advanceHour() {
  if (!round) return;
  currentHourIndex = (currentHourIndex + 1) % HOURS.length;
  NPCS().forEach(c => {
    const targetRoom = round.paths[c.id][currentHourIndex];
    if (targetRoom) sendNPCtoRoom(c.id, targetRoom);
  });
  renderTimeDisplay();
}
function updateNPCs(dt) {
  hourTimer += dt;
  if (hourTimer >= HOUR_INTERVAL) { hourTimer = 0; advanceHour(); }
  for (const c of CAST) {
    if (c.id === PLAYER_ID) continue;
    const s = npcState[c.id];
    if (s.moving && s.mode === 'moving') {
      s.px += ((s.path[s.step].x * TS) - s.px) * NPC_SPEED;
      s.py += ((s.path[s.step].y * TS) - s.py) * NPC_SPEED;
      if (Math.abs(s.px - s.path[s.step].x * TS) < 1 && Math.abs(s.py - s.path[s.step].y * TS) < 1) {
        s.gx = s.path[s.step].x; s.gy = s.path[s.step].y;
        s.px = s.gx * TS; s.py = s.gy * TS;
        s.step++;
        if (s.step >= s.path.length) {
          s.moving = false; s.tx = null; s.ty = null; s.path = []; s.step = 0;
          s.mode = 'idle'; s.timer = Math.random() * 30 + 10;
          const room = roomOf(s.gx, s.gy); if (room) SPOT[c.id].room = room;
        }
      }
      continue;
    }
    npcWander(c.id);
    if (!s.moving) continue;
    s.px += ((s.path[s.step].x * TS) - s.px) * NPC_SPEED;
    s.py += ((s.path[s.step].y * TS) - s.py) * NPC_SPEED;
    if (Math.abs(s.px - s.path[s.step].x * TS) < 1 && Math.abs(s.py - s.path[s.step].y * TS) < 1) {
      s.gx = s.path[s.step].x; s.gy = s.path[s.step].y;
      s.px = s.gx * TS; s.py = s.gy * TS;
      s.step++;
      if (s.step >= s.path.length) {
        s.moving = false; s.tx = null; s.ty = null; s.path = []; s.step = 0;
        const room = roomOf(s.gx, s.gy); if (room) SPOT[c.id].room = room;
      }

}

// ── 근접 감지 ───────────────────────────────────────────────
const PROXIMITY = 2;
let nearestNPC = null, proximityPulse = 0;
function updateProximity() {
  nearestNPC = null; let minD = Infinity;
  NPCS().forEach(c => {
    const s = npcState[c.id]; const d = Math.hypot(s.gx - playerGrid.x, s.gy - playerGrid.y);
    if (d < PROXIMITY && d < minD) { minD = d; nearestNPC = c.id; }
  });
  if (nearestNPC && !cur) { cur = nearestNPC; renderRoster(); renderLog(); }
}
// ── 입소문 ──────────────────────────────────────────────────
// 같은 자리에 오래 서 있으면 한 조각씩 주고받는다. 받은 쪽은 출처를 달아 기억한다.
// 플레이어의 증언판에는 자동으로 오르지 않는다 — 가까이 있어서 엿들어야 올라간다.
const GOSSIP_RANGE = 2.5;      // 이 안에 들어와야 말을 섞는다
const GOSSIP_COOLDOWN = 21000; // 같은 짝은 이 간격으로만 — 너무 빨리 오가면 읽을 틈이 없다
const EARSHOT = 5;             // 플레이어가 이 안에 있으면 엿듣는다

function sysLine(text) {
  const bucket = cur ? (chat[cur] ||= []) : (chat.__intro ||= []);
  bucket.push({ who: 'sys', text });
  renderLog();
}

// 엿들은 것은 증언판에 올리지 않는다. 귀띔일 뿐이다 —
// 판에 올리려면 네가 직접 물어서 그 사람 입으로 듣거나(harvest), 네 눈으로 봐야 한다.
function overhear(fromId, toId, g, line) {
  sysLine('(엿들었다) ' + nameOf(round, fromId) + ' → ' + nameOf(round, toId) + ': ' + line);
}

let gossipInFlight = 0, samCooldownUntil = 0;   // SAM 이 429 를 주면 잠깐 쉰다
// 사실은 memory.mjs 가 고르고, 문장은 SAM 이 짓는다. SAM 이 없거나 밀리면 기본 문장을 쓴다.
async function phraseGossip(speakerId, listenerId, g, fallback) {
  if (!llmReady || gossipInFlight >= 1 || Date.now() < samCooldownUntil) return fallback;
  gossipInFlight++;
  try {
    const msgs = buildGossipMessages({ round, speakerId, listenerId,
      persona: castPersona[speakerId], fact: fallback, kind: (g.src || g.entry).k });
    const r = await fetch('/api/sam/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: MODEL.fast, messages: msgs, temperature: 1, max_tokens: 90 }) });
    if (r.status === 429) { samCooldownUntil = Date.now() + 45000; return fallback; }
    const j = await r.json();
    const t = String(j.choices?.[0]?.message?.content || '').trim();
    if (!t) return fallback;
    // 지어낸 시각·장소·사람이 섞이면 버리고 기본 문장으로 돌아간다
    return violations(round, speakerId, t, memories[speakerId]).ok ? t : fallback;
  } catch { return fallback; }
  finally { gossipInFlight--; }
}

function updateGossip() {
  if (!round) return;
  const now = Date.now();
  const list = NPCS();
  for (let i = 0; i < list.length; i++) {
    for (let j = i + 1; j < list.length; j++) {
      const a = list[i], b = list[j];
      const sa = npcState[a.id], sb = npcState[b.id];
      if (!sa || !sb) continue;
      if (Math.hypot(sa.gx - sb.gx, sa.gy - sb.gy) > GOSSIP_RANGE) continue;
      const pair = a.id + '|' + b.id;
      if (now - (gossipAt[pair] || 0) < GOSSIP_COOLDOWN) continue;
      gossipAt[pair] = now;
      // 번갈아 말한다 — 한쪽만 떠드는 그림이 되지 않게
      gossipTurn[pair] = (gossipTurn[pair] || 0) + 1;
      const speaker = gossipTurn[pair] % 2 ? a : b, listener = gossipTurn[pair] % 2 ? b : a;
      const g = gossipOnce(round, memories[speaker.id], memories[listener.id]);
      if (!g) continue;
      gossipCount++;
      const base = gossipLine(round, g);
      const ss = npcState[speaker.id];
      const inEarshot = Math.hypot(ss.gx - playerGrid.x, ss.gy - playerGrid.y) <= EARSHOT;
      bubbles[speaker.id] = { text: base, at: Date.now() };
      phraseGossip(speaker.id, listener.id, g, base).then(line => {
        bubbles[speaker.id] = { text: line, at: Date.now() };
        if (inEarshot) overhear(speaker.id, listener.id, g, line);
      });
      renderRoster();
      const pg = $('#pillGossip'); if (pg) pg.textContent = '소문 ' + gossipCount;
    }
  }
}

// ── 키보드 ──────────────────────────────────────────────────
window.addEventListener('keydown', e => {

  const dir = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0], w:[0,-1], s:[0,1], a:[-1,0], d:[1,0], W:[0,-1], S:[0,1], A:[-1,0], D:[1,0] }[e.key];

// ── 그리기 ──────────────────────────────────────────────────
let frame = 0, lastTick = performance.now();
function tick(now = performance.now()) {
  frame = (frame + 1) % 15;
  const dt = (now - lastTick) / 16.667; lastTick = now;
  updatePlayer(dt); updateNPCs(dt); updateProximity(); updateGossip();
  proximityPulse = (proximityPulse + dt * 0.05) % (Math.PI * 2);
  // SPUM 런타임이 #scene을 자체 rAF로 관리. 위치만 동기화.
  if (spumReady) syncSPUM();
  // UI(이름·말풍선·방 태그)는 별도 #overlay에만 그린다.

}

function drawOverlay() {
  const cv = $('#overlay'); if (!cv) return;
  const cx = cv.getContext('2d'); cx.clearRect(0, 0, cv.width, cv.height);
  cx.imageSmoothingEnabled = false;

  CAST.forEach(c => {
    const s = SPOT[c.id]; if (!s) return;

    if (isMe) {
      // 몸은 SPUM 런타임이 그린다. 여기서는 내 것임을 알리는 표시만 얹는다.
      cx.strokeStyle = 'rgba(232,137,74,.85)'; cx.lineWidth = 2; cx.setLineDash([3, 3]);
      cx.strokeRect(px - 6, py - 20, TS + 12, TS + 26); cx.setLineDash([]);
      cx.font = '800 12px "Pretendard",system-ui';

      cx.fillStyle = 'rgba(232,137,74,.92)'; cx.fillRect(px + TS/2 - nw/2, py + TS + 4, nw, 16);
      cx.fillStyle = '#fff'; cx.fillText(label, px + TS / 2, py + TS + 16);
      return;
    }
    if (nearestNPC === c.id && cur !== c.id) {
      const pulse = 0.5 + 0.5 * Math.sin(proximityPulse);
      cx.strokeStyle = `rgba(123,178,106,${0.4 + pulse * 0.4})`;
      cx.lineWidth = 2.5; cx.setLineDash([4, 4]);
      cx.strokeRect(px - 12, py - 28, TS + 24, TS + 36);
      cx.setLineDash([]);
      cx.font = '700 10px "Pretendard",system-ui'; cx.textAlign = 'center';
      cx.fillStyle = `rgba(123,178,106,${0.6 + pulse * 0.3})`;
      cx.fillText('대화 [E]', px + TS / 2, py - 30);
      cx.textAlign = 'left';
    }
    if (cur === c.id) { cx.strokeStyle = '#FFB86B'; cx.lineWidth = 2; cx.strokeRect(px - 10, py - 26, TS + 20, TS + 32); }
    // 이름은 SPUM BubbleRenderer 가 캐릭터 위에 이미 그린다 — 여기서 또 그리지 않는다.
    const bub = bubbles[c.id];
    if (bub && Date.now() - bub.at < 16000) {
      cx.font = '600 17px "Pretendard",system-ui';
      const lines = bub.text.replace(/\n+/g, ' ').match(/.{1,18}/g)?.slice(0, 3) || [];
      const bw = Math.max(...lines.map(l => cx.measureText(l).width)) + 24, bh = lines.length * 22 + 16;

      cx.beginPath(); cx.roundRect(bx, by, bw, bh, 12); cx.fill(); cx.stroke();
      cx.fillStyle = '#4A3728';
      lines.forEach((l, i) => cx.fillText(l, px + TS / 2, by + 26 + i * 22));

}

// ── 렌더링 ──────────────────────────────────────────────────

  const y = (ev.clientY - r.top) / r.height * cv.height / TS;

}

function renderTimeDisplay() { const el = $('#pillTime'); if (el && round) el.textContent = `시간 ${HOURS[currentHourIndex]}`; }

function record(aboutId, hour, room, kind, by) {
  (board[aboutId] ||= {}); (board[aboutId][hour] ||= []);
  if (!board[aboutId][hour].some(x => x.room === room && x.kind === kind)) board[aboutId][hour].push({ room, kind, by });
  if (cur && (by === nameOf(round, cur) || by === 'player' || kind === 'own' && aboutId === 'player')) (discovered[cur] ||= new Set()).add(hour + '|' + room);
  if (by && by !== 'player') (discovered[cur] ||= new Set()).add(hour + '|' + room);

}
// 대화에서 「누가 · 몇 시에 · 어디」를 뽑아 증언판에 올린다.
// 문장 단위로 보고, 방과 가장 가까운 시각을 짝짓는다.
// 시각을 빼먹은 답("텃밭에 있었어")은 직전 화제의 시각으로 잇는다.
function harvest(speaker, text, askedHour = null) {
  const t = topic[speaker] || {};
  let lastHour = askedHour || t.hour || null;
  const put = (h, r, sent) => {
    if (!HOURS.includes(h) || !ROOMS.includes(r)) return;
    const other = CAST.find(c => c.id !== speaker && sent.includes(c.name));
    if (other) { record(other.id, h, r, 'seen', nameOf(round, speaker)); }
    else if (speaker !== 'player') record(speaker, h, r, 'own');
    t.hour = h; t.room = r; lastHour = h;
  };
  for (const sent of String(text).split(/[.!?\n]/)) {
    if (!sent.trim()) continue;
    const rs = ROOMS.map(r => ({ r, i: sent.indexOf(r) })).filter(x => x.i >= 0);
    if (!rs.length) continue;
    const hs = HOURS.map(h => ({ h, i: sent.indexOf(h) })).filter(x => x.i >= 0);
    if (hs.length) {
      rs.forEach(({ r, i }) => {
        const near = hs.reduce((a, b) => Math.abs(b.i - i) < Math.abs(a.i - i) ? b : a);
        put(near.h, r, sent);
      });
    } else if (lastHour) {
      rs.forEach(({ r }) => put(lastHour, r, sent));
    }
  }
  topic[speaker] = t;
}
function say(who, text) {
  if (who === null) { (chat.__intro ||= []).push({ who: 'sys', text }); renderLog(); return; }
  chat[cur].push({ who, text });
  if (who !== 'player') { bubbles[cur] = { text, at: Date.now() }; harvest(cur, text, lastAskedHour); }
  else harvest('player', text);
  renderLog();
}

// ── 대사 ────────────────────────────────────────────────────

    : HOURS.find(h => h === String(intent.hour > 24 ? intent.hour - 24 : intent.hour).padStart(2, '0') + '시'

  const mem = memories[id];

  noteAsked(round, mem, topicOf(intent, userText));

    persona: castPersona[id], playerCard: playerCardOf() });

  try {
    const r = await fetch('/api/sam/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: MODEL.normal, messages: msgs, temperature: 0.9, max_tokens: 220 }) });
    const j = await r.json();
    let text = j.choices?.[0]?.message?.content || j.output?.content || '';
    text = String(text).trim();
    const v = violations(round, id, text, mem);
    if (!v.ok) {
      const retry = await fetch('/api/sam/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: MODEL.normal, temperature: 0.6, max_tokens: 200,
          messages: [...msgs, { role: 'assistant', content: text },
            { role: 'user', content: '지금 말한 것 중에 네가 실제로 아는 게 아닌 시각·장소·사람이 섞였다. 아는 것만으로 다시 한 문장 말해라.' }] }) });
      const j2 = await retry.json();
      text = (j2.choices?.[0]?.message?.content || text).trim();
    }
    return text || template(id, userText);
  } catch { return template(id, userText); }
}
function template(id, q) {
  const k = knowledgeOf(round, id);
  if (/먹었|케이크/.test(q)) return `아니. 안 먹었어. ${k.shield.line}.`;
  if (/어디/.test(q)) return `${k.own[0].hour}엔 ${k.own[0].room}, ${k.own[1].hour}엔 ${k.own[1].room}에 있었어.`;
  if (/이후|그 뒤/.test(q)) return `그 뒤엔 ${k.own[2].room}.`;
  if (/누구|봤/.test(q)) return k.seen.length ? `${k.seen[0].hour}에 ${k.seen[0].room}에서 ${nameOf(round, k.seen[0].who)}를 봤어.` : '아무도 못 봤는데.';
  return '음… 그건 잘 모르겠어.';
}
async function send() {
  const v = $('#say').value.trim();
  if (!v || !cur || talks >= budget) return;
  $('#say').value = ''; say('player', v);
  talks++; renderLog();
  const btn = $('#send'); btn.disabled = true; btn.textContent = '…';
  const a = await ask(cur, v);
  say(cur, a);
  btn.disabled = false; btn.textContent = '말한다';
}
$('#send').onclick = send;
$('#say').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
$('#btnNew').onclick = async () => {
  if (!confirm('새 판을 시작할까? 캐릭터부터 다시 고른다.')) return;
  await pickPlayer(); seatCast(); newRound();
};
$('#btnNextHour').addEventListener('click', () => { advanceHour(); });

// ── 지목 ────────────────────────────────────────────────────
$('#btnAccuse').onclick = () => {
  let who = null, hour = null, wit = null;
  const b = $('#dlgBody');
  b.innerHTML = '<h2>지목한다</h2><p class="note">먹은 사람 · 그 시각 · 그걸 증명할 목격자를 한꺼번에 맞혀야 한다.</p>';
  const mk = (label, items, cb) => {
    b.append(el('p', null, label));
    const row = el('div', 'sel');
    items.forEach(it => { const x = el('button', null, it.t); x.onclick = () => { [...row.children].forEach(c => c.classList.remove('on')); x.classList.add('on'); cb(it.v); }; row.append(x); });
    b.append(row);
  };
  mk('먹은 건 누구?', CAST.map(c => ({ t: c.name, v: c.id })), v => who = v);
  mk('몇 시에?', HOURS.map(h => ({ t: h, v: h })), v => hour = v);
  mk('그걸 밝혀 줄 목격자는?', CAST.map(c => ({ t: c.name, v: c.id })), v => wit = v);
  const go = el('button', 'primary', '이걸로 간다'); go.style.marginTop = '12px';
  go.onclick = () => { $('#dlg').close(); verdict(who, hour, wit); };
  const no = el('button', null, '더 물어본다'); no.style.marginLeft = '8px';
  no.onclick = () => $('#dlg').close();
  b.append(go, no);
  $('#dlg').showModal();
};
function verdict(who, hour, wit) {
  const okWho = who === round.culprit, okHour = hour === HOURS[round.theftHour], win = okWho && okHour;
  const b = $('#dlgBody');
  const truth = CAST.map(c => `${c.name}: ` + HOURS.map((h, i) => `${h} ${round.paths[c.id][i]}`).join(' · ')).join('\n');
  b.innerHTML = '';
  b.append(el('h2', null, win ? '맞혔다!' : '틀렸다…'));
  b.append(el('p', null, `먹은 건 ${nameOf(round, round.culprit)}, ${HOURS[round.theftHour]}에 부엌에서였다.` +
    (round.accomplice ? ` ${nameOf(round, round.accomplice)}이(가) 감싸 주고 있었다.` : ' 아무도 감싸 주지 않았다.')));
  const pre = el('pre', 'note'); pre.style.whiteSpace = 'pre-wrap'; pre.textContent = truth; b.append(pre);
  const again = el('button', 'primary', '한 판 더'); again.onclick = () => { $('#dlg').close(); newRound(); };
  b.append(again);
  $('#dlg').showModal();
}

// ── 누구로 플레이할지 고른다 ────────────────────────────────
function chooseCharacter() {
  return new Promise(resolve => {
    const dlg = $('#dlg'), body = $('#dlgBody');
    let done = false;
    // Esc 나 바깥 클릭으로 닫히면 안 된다 — 고르기 전에는 창이 사라지지 않는다
    const block = e => { if (!done) e.preventDefault(); };
    const reopen = () => { if (!done) dlg.showModal(); };
    dlg.addEventListener('cancel', block);
    dlg.addEventListener('close', reopen);
    const finish = id => {
      done = true;
      dlg.removeEventListener('cancel', block);
      dlg.removeEventListener('close', reopen);
      dlg.close();
      resolve(id);
    };
    body.innerHTML = '';
    body.append(el('h2', null, '누구로 살겠나'));
    body.append(el('p', 'note', '여섯 하우스메이트 가운데 하나를 고른다. 나머지 다섯이 용의자다.'));
    const wrap = el('div', 'sel');
    CAST.forEach(c => {
      const b = document.createElement('button');
      const colors = CHARACTER_COLORS[c.id] || {};
      b.style.borderLeft = '6px solid ' + (colors.body || '#ccc');
      b.textContent = (CHARACTER_EMOJI[c.id] || '👤') + ' ' + c.name + ' · ' + c.species;
      b.onclick = () => finish(c.id);
      wrap.append(b);
    });
    body.append(wrap);
    dlg.showModal();
  });
}

// 고를 때마다 인격표를 다시 만든다. 플레이어가 고른 캐릭터는 빼고 채운다 —
// 그래야 성격·MBTI 가 SAM 프롬프트에 실릴 길 자체가 없다.
// NPC 에게 알려 줄 「네가 누구인지」. 직업과 내력만이다 — 성격·MBTI·말투는 뺀다.
function playerCardOf() {
  const p = castPersonaAll[PLAYER_ID];
  const name = (CAST.find(c => c.id === PLAYER_ID) || {}).name || '';
  if (!p) return { name };
  return { name, occupation: p.occupation || '', background: p.background || '' };
}

async function pickPlayer() {
  PLAYER_ID = await chooseCharacter();
  Object.keys(castPersona).forEach(k => delete castPersona[k]);
  Object.entries(castPersonaAll).forEach(([id, p]) => { if (id !== PLAYER_ID) castPersona[id] = p; });
  return PLAYER_ID;
}

// ── 게임 시작 ──────────────────────────────────────────────
function newRound() {
  round = makeRound((Math.random() * 2147483000) | 0, PLAYER_ID);
  seatCast();
  talks = 0; cur = null; currentHourIndex = 0; hourTimer = 0;
  CAST.forEach(c => { chat[c.id] = []; board[c.id] = {}; topic[c.id] = {}; memories[c.id] = createMemory(round, c.id); });
  Object.keys(gossipAt).forEach(k => delete gossipAt[k]);
  Object.keys(gossipTurn).forEach(k => delete gossipTurn[k]);
  gossipCount = 0; $('#pillGossip').textContent = '소문 0';
  Object.keys(discovered).forEach(k => delete discovered[k]);
  NPCS().forEach(c => {
    const room = round.paths[c.id][0];
    if (room && ROOM_POS[room]) {
      const pos = roomToGrid(room);
      if (pos) { npcState[c.id].gx = pos.x; npcState[c.id].gy = pos.y; npcState[c.id].px = pos.x * TS; npcState[c.id].py = pos.y * TS; SPOT[c.id].room = room; }
    }
  });
  renderRoster(); renderBoard(); renderLog(); renderTimeDisplay();
  const me = knowledgeOf(round, PLAYER_ID);
  const meName = (CAST.find(c => c.id === PLAYER_ID) || {}).name || '나';
  $('#myrole').innerHTML = '넌 <b>' + meName + '</b>다. 넌 안 먹었다. <b>진짜 먹은 하나</b>를 찾아라.'
    + '<br><span class="note">네 방패: "' + me.shield.line + '"</span>'
    + '<br><span class="note">식구들은 네가 ' + ((castPersonaAll[PLAYER_ID] || {}).occupation || '누구인지') + '라는 건 안다.'
    + ' 하지만 네 성격·MBTI 는 판에서 빠진다 — 말은 네가 하고 싶은 대로 한다.</span>';
  say(null, '아침이다. 냉장고 앞에 빈 접시만 덩그러니 놓여 있다. 어젯밤 집 안에는 여섯뿐이었다.');
}

async function boot() {
  const premise = await (await fetch('./premise.json')).json();
  world = premise.world;
  // SPUM Cast 정본에서 인격을 읽는다
  // 인격을 못 읽어도 캐릭터 고르기까지 막지는 않는다 (인격 없이도 판은 돈다)
  try {
    (await (await fetch('./cast.json')).json()).forEach(c => { castPersonaAll[c.id] = c.persona || null; });
  } catch (e) { console.warn('[cast] 인격을 못 읽었다:', e.message); }
  const h = await fetch('/api/health').then(r => r.json()).catch(() => ({ sam: 'missing' }));
  llmReady = h.sam === 'ready' || h.sam === 'bridge';
  $('#pillLLM').textContent = h.sam === 'ready' ? 'SAM · claude-sonnet-4.6' : (h.sam === 'bridge' ? 'SAM · 로그인 다리' : 'SAM 없음 · 간이모드');
  spumMap = await loadSpumMap('./');
  spumObstacle = new Uint8Array(spumMap.obstacle);
  drawBackground();
  await pickPlayer();
  seatCast();
  await initSPUM();
  if (spumReady) {
    spumRuntime.setViewport({ cssWidth: MW * TS, cssHeight: MH * TS, dpr: 1 });
    spumRuntime.setRunning(true);
    // 첫 sync — 맵+캐릭터 데이터 전달. 런타임이 자체 rAF로 렌더링 시작.
    syncSPUM();
    console.log('[SPUM] First sync done. Runtime manages #scene rendering.');
    buildAvatars();   // 기다리지 않는다 — 다 구워지면 로스터가 알아서 바뀐다
  }
  $('#scene').addEventListener('click', sceneClick);
  newRound();
  requestAnimationFrame(tick);
}

// 자동 검증용 손잡이. 게임 로직은 이것을 읽지 않는다 (check-step5.mjs 가 쓴다).
window.__wamc = {
  get round() { return round; },
  get gossip() { return gossipCount; },
  memories, npcState, playerGrid,
  get obstacle() { return spumObstacle; },
  warp(x, y) { playerGrid.x = x; playerGrid.y = y; playerPx.x = x * TS; playerPx.y = y * TS; },
};

// 대화창을 맵 위에 얹는다 — 아래에 있으면 맵을 보면서 말을 걸 수가 없다
// 평소엔 접혀 있다가 말을 걸 때만 나온다. 맵을 가리지 않는 것이 먼저다.
let chatCard = null;
function openChat() { chatCard?.classList.remove('away'); const t = $('#chatToggle'); if (t) t.style.display = 'none'; $('#say')?.focus(); }
function closeChat() { chatCard?.classList.add('away'); const t = $('#chatToggle'); if (t) t.style.display = ''; }
(function overlayChat() {
  const card = [...document.querySelectorAll('.grid .card')].find(c => c.querySelector('#log'));
  const stage = document.querySelector('#stage');
  if (!card || !stage) return;
  chatCard = card;
  card.classList.add('overchat', 'away');
  card.style.position = 'absolute';
  const x = el('button', null, '✕'); x.id = 'chatClose'; x.onclick = closeChat; card.append(x);
  stage.append(card);
  const t = el('button', null, '💬 대화'); t.id = 'chatToggle'; t.onclick = openChat;
  stage.append(t);
})();

boot();
</script>
