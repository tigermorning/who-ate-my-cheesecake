<!doctype html><meta charset="utf-8"><title>tiles</title>
<body style="margin:0;background:#111">
<canvas id="c" width="1024" height="1024"></canvas>
<script>
const img=new Image(); img.src='./tilesheet.png';
img.onload=()=>{const cx=document.getElementById('c').getContext('2d');
 cx.imageSmoothingEnabled=false; cx.drawImage(img,0,0);
 const S=64; cx.font='11px monospace'; cx.lineWidth=1;
 for(let r=0;r<16;r++)for(let c=0;c<16;c++){
  cx.strokeStyle='rgba(0,200,255,.7)'; cx.strokeRect(c*S,r*S,S,S);
  cx.fillStyle='rgba(0,0,0,.75)'; cx.fillRect(c*S,r*S,26,12);
  cx.fillStyle='#7fe3ff'; cx.fillText(c+','+r,c*S+2,r*S+10);}};
</script>
